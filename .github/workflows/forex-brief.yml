name: Forex brief

on:
  schedule:
    # GitHub cron is in UTC (Nepal = UTC+5:45).
    # DAILY, Monday to Friday:
    #   00:45 UTC = 6:30 AM Nepal  (after the US close / Asia open)
    #   11:45 UTC = 5:30 PM Nepal  (before the London afternoon / US open)
    - cron: "45 0 * * 1-5"
    - cron: "45 11 * * 1-5"
    # WEEKLY, Sunday 06:15 UTC = 12:00 noon Nepal
    # (the new week's calendar is published by then)
    - cron: "15 6 * * 0"
  workflow_dispatch:
    inputs:
      mode:
        description: "Which edition to build"
        type: choice
        options: [daily, weekly]
        default: daily

permissions:
  contents: write         # needed to save the brief back to the repository

jobs:
  brief:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build brief
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MODE: ${{ github.event.schedule == '15 6 * * 0' && 'weekly' || inputs.mode || 'daily' }}
          CURRENCIES: "USD,EUR,GBP,JPY,AUD,NZD,CAD,CHF,CNY"
          CHANNEL_NAME: "FX • Gold • Oil Brief"
        run: python forex_brief.py
      - name: Save brief
        run: |
          git config user.name "forex-brief-bot"
          git config user.email "forex-brief-bot@users.noreply.github.com"
          git add *.txt
          git diff --cached --quiet || git commit -m "Brief $(date -u +%F_%H%M)"
          git pull --rebase --quiet || true
          git push
